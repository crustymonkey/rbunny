<html>
<head>
  <title>Alias List</title>
  <style>
    table {
      border-collapse: collapse;
    }

    td, th {
      text-align: left;
      border: 1px solid gray;
      padding: 5px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <th>Shortcut</th>
      <th>Url Template</th>
      <th>Url Fallback</th>
      <th>Url</th>
    </tr>
    {% for sc in map %}
    <tr>
      <td><b>{{ sc }}</b></td>
      <td>{{ map[sc]["url_tpl"] }}</td>
      <td>{{ map[sc]["url_fallback"] }}</td>
      <td>{{ map[sc]["url"] }}</td>
    </tr>
    {% endfor %}
  </table>
  
</body>
</html>
