[package]
name = "rbunny"
version = "0.1.0"
description = "This is a Rust implementation of a bunnylol server"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version="4", features=["derive", "cargo"] }
log = "0.4"
chrono = "0.4"
anyhow = "1"
tokio = { version="1", features=["full"] }
axum = "0.7"
axum-extra = { version="0.9", features=["cookie", "form"]}
configparser = "3"
urlencoding = "2"
minijinja = { version="1", features=["loader"] }

[profile.dev]
overflow-checks = true
opt-level = 1

[[bin]]
name = "rbunny"
path = "src/rbunny.rs"
